        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* 类别选项卡 (五大类) */
        .category-tabs {
            display: flex;
            overflow-x: auto;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            padding: 0 8px;
            scrollbar-width: thin;
        }
        .cat-btn {
            flex: 0 0 auto;
            padding: 14px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            background: none;
            border: none;
            color: #5b6e8c;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
            background: #f8fafc;
        }

        /* 学习/复习 主标签 */
        .mode-tabs {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 20px;
        }
        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            transition: 0.2s;
        }
        .mode-btn.active {
            color: #3b82f6;
            border-bottom: 3px solid #3b82f6;
            background: #f8fafc;
        }

        .panel {
            display: none;
            padding: 20px 16px 28px;
            animation: fade 0.25s ease;
        }
        .panel.active-panel {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* 卡片样式 */
        .word-card {
            background: #fff;
            border-radius: 32px;
            padding: 28px 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            margin-bottom: 24px;
        }
        .indo-word {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f172a;
            word-break: break-word;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 8px;
        }
        .option-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 6px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
            transition: all 0.1s;
            cursor: pointer;
        }
        .option-btn:active { transform: scale(0.97); background: #eef2ff; }

        .timer-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 16px 0;
            overflow: hidden;
        }
        .timer-progress {
            width: 100%;
            height: 100%;
            background: #3b82f6;
            transition: width linear 0.05s;
        }
        .chinese-answer {
            background: #eff6ff;
            padding: 18px;
            border-radius: 28px;
            margin: 12px 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: #0c4a6e;
        }
        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
        .btn-remember, .btn-forget {
            flex: 1;
            padding: 12px 0;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-remember {
            background: #3b82f6;
            color: white;
        }
        .btn-forget {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .info-bar {
            background: #f1f5f9;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #334155;
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .hint-text {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 12px;
        }
        .next-tip {
            font-size: 0.7rem;
            text-align: center;
            color: #94a3b8;
            margin-top: 20px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            padding: 12px;
            color: #94a3b8;
            border-top: 1px solid #eef2ff;
        }
    </style>
</head>

    // 给每个单词分配唯一ID
    let globalWordId = 0;
    const allWordsMap = new Map(); // id => {id, indo, chinese, cat}
    const catWordsMap = new Map(); // cat => array of word objects

    for (let [catKey, catObj] of Object.entries(categories)) {
        let list = [];
        for (let w of catObj.words) {
            let id = globalWordId++;
            let fullWord = { id, indo: w.indo, chinese: w.chinese, category: catKey };
            allWordsMap.set(id, fullWord);
            list.push(fullWord);
        }
        catWordsMap.set(catKey, list);
    }

    // 存储: 每个分类下未学习的单词ID数组, 复习队列(全局跨类复习队列)
    let unlearnedByCat = new Map(); // catKey -> Set of word ids
    let reviewQueue = []; // { wordId, nextReviewDate }

    // 初始化本地数据
    function loadData() {
        for (let cat of Object.keys(categories)) {
            let stored = localStorage.getItem(`unlearned_${cat}`);
            if (stored) {
                let arr = JSON.parse(stored);
                unlearnedByCat.set(cat, new Set(arr));
            } else {
                let allIds = catWordsMap.get(cat).map(w => w.id);
                unlearnedByCat.set(cat, new Set(allIds));
            }
        }
        let storedReview = localStorage.getItem("reviewQueueAll");
        if (storedReview) {
            reviewQueue = JSON.parse(storedReview);
            reviewQueue = reviewQueue.filter(item => allWordsMap.has(item.wordId));
        } else {
            reviewQueue = [];
        }
        updateStatsUI();
    }

    function persistUnlearned(cat) {
        let arr = Array.from(unlearnedByCat.get(cat));
        localStorage.setItem(`unlearned_${cat}`, JSON.stringify(arr));
    }

    function persistReview() {
        localStorage.setItem("reviewQueueAll", JSON.stringify(reviewQueue));
    }

    // 新词学习后加入隔天复习
    function addToReviewTomorrow(wordId) {
        let tomorrow = Date.now() + 86400000;
        let idx = reviewQueue.findIndex(item => item.wordId === wordId);
        if (idx === -1) reviewQueue.push({ wordId, nextReviewDate: tomorrow });
        else reviewQueue[idx].nextReviewDate = tomorrow;
        persistReview();
        updateStatsUI();
    }

    function markLearned(wordId, cat) {
        let set = unlearnedByCat.get(cat);
        if (set.has(wordId)) {
            set.delete(wordId);
            persistUnlearned(cat);
        }
        updateStatsUI();
    }

    function getDueReviews() {
        let now = Date.now();
        return reviewQueue.filter(item => item.nextReviewDate <= now).map(item => item.wordId);
    }

    function removeFromReview(wordId) {
        let idx = reviewQueue.findIndex(i => i.wordId === wordId);
        if (idx !== -1) reviewQueue.splice(idx, 1);
        persistReview();
        updateStatsUI();
    }

    function resetReviewDate(wordId) {
        let idx = reviewQueue.findIndex(i => i.wordId === wordId);
        if (idx !== -1) reviewQueue[idx].nextReviewDate = Date.now();
        else reviewQueue.push({ wordId, nextReviewDate: Date.now() });
        persistReview();
        updateStatsUI();
    }

    function updateStatsUI() {
        let activeCat = currentCategory;
        let catWords = catWordsMap.get(activeCat) || [];
        let total = catWords.length;
        let remaining = unlearnedByCat.get(activeCat)?.size || 0;
        document.getElementById("catTotal").innerText = total;
        document.getElementById("newRemaining").innerText = remaining;
        let due = getDueReviews().length;
        document.getElementById("reviewDueCount").innerText = due;
        document.getElementById("reviewPoolCount").innerText = reviewQueue.length;
    }

    // ---------- 当前活动分类与模式 ----------
    let currentCategory = "daily";
    let currentMode = "new";   // "new" or "review"
    let currentNewWordId = null;
    let waitingNext = false;
    let currentReviewWordId = null;
    let reviewTimer = null;
    let reviewSecondsLeft = 5;
    let reviewChineseShown = false;
    let reviewAllowAction = true;

    // 从当前分类随机获取未学单词
    function getRandomUnlearnedByCat(cat) {
        let set = unlearnedByCat.get(cat);
        if (!set || set.size === 0) return null;
        let ids = Array.from(set);
        let randomIdx = Math.floor(Math.random() * ids.length);
        return ids[randomIdx];
    }

    // 生成四个选项 (正确 + 随机三个不同中文)
    function generateOptions(correctWord) {
        let allWordsInCat = catWordsMap.get(currentCategory) || [];
        let otherChinese = allWordsInCat.filter(w => w.id !== correctWord.id).map(w => w.chinese);
        let uniqueOthers = [...new Set(otherChinese)];
        let shuffled = [...uniqueOthers];
        for (let i = shuffled.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        let wrong = shuffled.slice(0, 3);
        while (wrong.length < 3) wrong.push("默认选项");
        let options = [...wrong, correctWord.chinese];
        for (let i = options.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        return options.map(opt => ({ text: opt, isCorrect: opt === correctWord.chinese }));
    }

    async function renderNewWord() {
        if (waitingNext) return;
        let wordId = getRandomUnlearnedByCat(currentCategory);
        if (!wordId) {
            document.getElementById("newIndoWord").innerText = "🎉 本类单词已学完！";
            document.getElementById("optionsContainer").innerHTML = `<div style="grid-column:span2; text-align:center">切换分类继续学习</div>`;
            currentNewWordId = null;
            return;
        }
        currentNewWordId = wordId;
        let wordObj = allWordsMap.get(wordId);
        document.getElementById("newIndoWord").innerText = wordObj.indo;
        let opts = generateOptions(wordObj);
        let container = document.getElementById("optionsContainer");
        container.innerHTML = "";
        opts.forEach(opt => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => handleNewAnswer(opt.isCorrect, wordObj);
            container.appendChild(btn);
        });
        document.getElementById("newFeedbackMsg").innerHTML = "🤔 请选择正确释义";
    }

    function handleNewAnswer(isCorrect, wordObj) {
        if (waitingNext) return;
        waitingNext = true;
        let feed = document.getElementById("newFeedbackMsg");
        if (isCorrect) {
            feed.innerHTML = "✅ 正确！已加入明天复习队列";
            markLearned(wordObj.id, wordObj.category);
            addToReviewTomorrow(wordObj.id);
        } else {
            feed.innerHTML = `❌ 错误！正确: ${wordObj.chinese}。该词已加入复习队列`;
            markLearned(wordObj.id, wordObj.category);
            addToReviewTomorrow(wordObj.id);
        }
        let btns = document.querySelectorAll("#optionsContainer .option-btn");
        btns.forEach(btn => btn.disabled = true);
        setTimeout(() => {
            waitingNext = false;
            renderNewWord();
        }, 1000);
    }

    // 复习模块逻辑
    function stopReviewTimer() { if (reviewTimer) { clearInterval(reviewTimer); reviewTimer = null; } }
    function startReviewTimer() {
        reviewSecondsLeft = 5;
        let progress = document.getElementById("timerProgress");
        let chDiv = document.getElementById("reviewChineseDisplay");
        if (progress) progress.style.width = "100%";
        reviewTimer = setInterval(() => {
            if (!reviewAllowAction) return;
            reviewSecondsLeft -= 0.1;
            if (progress) {
                let pct = Math.max(0, (reviewSecondsLeft / 5) * 100);
                progress.style.width = `${pct}%`;
            }
            if (reviewSecondsLeft <= 0 && !reviewChineseShown && currentReviewWordId) {
                let w = allWordsMap.get(currentReviewWordId);
                if (w) {
                    chDiv.innerHTML = `📖 ${w.chinese}`;
                    chDiv.style.background = "#d9f0ff";
                    reviewChineseShown = true;
                }
                stopReviewTimer();
                if (progress) progress.style.width = "0%";
            }
        }, 100);
    }

    function loadNextReview() {
        stopReviewTimer();
        reviewAllowAction = true;
        reviewChineseShown = false;
        let dueIds = getDueReviews();
        if (dueIds.length === 0) {
            document.getElementById("reviewIndoWord").innerText = "🎉 无待复习单词";
            document.getElementById("reviewChineseDisplay").innerHTML = "完成啦，明天再来";
            document.getElementById("rememberBtn").disabled = true;
            document.getElementById("forgetBtn").disabled = true;
            currentReviewWordId = null;
            return;
        }
        currentReviewWordId = dueIds[0];
        let word = allWordsMap.get(currentReviewWordId);
        document.getElementById("reviewIndoWord").innerText = word.indo;
        document.getElementById("reviewChineseDisplay").innerHTML = "⏳ 5秒后显示中文";
        document.getElementById("reviewChineseDisplay").style.background = "#f1f5f9";
        document.getElementById("rememberBtn").disabled = false;
        document.getElementById("forgetBtn").disabled = false;
        reviewChineseShown = false;
        if (document.getElementById("timerProgress")) document.getElementById("timerProgress").style.width = "100%";
        startReviewTimer();
    }

    function handleRemember() {
        if (!reviewAllowAction || !currentReviewWordId) return;
        reviewAllowAction = false;
        stopReviewTimer();
        removeFromReview(currentReviewWordId);
        loadNextReview();
    }
    function handleForget() {
        if (!reviewAllowAction || !currentReviewWordId) return;
        reviewAllowAction = false;
        stopReviewTimer();
        resetReviewDate(currentReviewWordId);
        loadNextReview();
    }

    // 切换分类时刷新新词界面
    function switchCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll(".cat-btn").forEach(btn => {
            if (btn.dataset.cat === cat) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        updateStatsUI();
        if (currentMode === "new") {
            waitingNext = false;
            renderNewWord();
        } else {
            // 复习模式不依赖分类，但保持界面
        }
    }

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll(".mode-btn").forEach(btn => {
            if (btn.dataset.mode === mode) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        document.getElementById("newPanel").classList.toggle("active-panel", mode === "new");
        document.getElementById("reviewPanel").classList.toggle("active-panel", mode === "review");
        if (mode === "new") renderNewWord();
        else loadNextReview();
    }

    // 初始化UI与事件
    function init() {
        loadData();
        document.getElementById("rememberBtn").addEventListener("click", handleRemember);
        document.getElementById("forgetBtn").addEventListener("click", handleForget);
        document.querySelectorAll(".cat-btn").forEach(btn => {
            btn.addEventListener("click", () => switchCategory(btn.dataset.cat));
        });
        document.querySelectorAll(".mode-btn").forEach(btn => {
            btn.addEventListener("click", () => switchMode(btn.dataset.mode));
        });
        renderNewWord();
        updateStatsUI();
    }

    init();
</script>
</body>
</html>
