<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>印尼语背单词 - 新词与复习系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #f1f5f9;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 20px;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 18px 0;
            font-size: 1.2rem;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-bottom: 3px solid #3b82f6;
            background: #f8fafc;
        }
        .panel {
            display: none;
            padding: 24px 20px 32px;
            animation: fade 0.25s ease;
        }
        .panel.active-panel {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .word-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 32px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid #eef2ff;
            margin-bottom: 28px;
        }
        .indo-word {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0f172a;
            word-break: break-word;
            margin-bottom: 16px;
        }
        .hint-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 12px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0 10px;
        }
        .option-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px 8px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .option-btn:active {
            transform: scale(0.97);
            background: #eef2ff;
        }
        .review-word-area {
            text-align: center;
        }
        .timer-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 20px 0 16px;
            overflow: hidden;
        }
        .timer-progress {
            width: 100%;
            height: 100%;
            background: #3b82f6;
            transition: width linear 0.05s;
        }
        .chinese-answer {
            background: #eef2ff;
            padding: 20px;
            border-radius: 28px;
            margin: 16px 0;
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f172a;
        }
        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
        .btn-remember, .btn-forget {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-remember {
            background: #3b82f6;
            color: white;
            box-shadow: 0 2px 8px rgba(59,130,246,0.3);
        }
        .btn-forget {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .btn-remember:active, .btn-forget:active {
            transform: scale(0.97);
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #334155;
        }
        .next-tip {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 16px;
            color: #94a3b8;
            border-top: 1px solid #eef2ff;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="new">📖 新词学习</button>
        <button class="tab-btn" data-tab="review">🔄 智能复习</button>
    </div>
    <div id="newPanel" class="panel active-panel">
        <div class="info-bar">
            <span>📚 词库总量: <span id="totalWordsCount">0</span></span>
            <span>✨ 未学新词: <span id="remainingNewCount">0</span></span>
        </div>
        <div id="newWordArea">
            <div class="word-card">
                <div class="indo-word" id="newIndoWord">-</div>
                <div class="options-grid" id="optionsContainer"></div>
                <div class="hint-text" id="newFeedbackMsg">点击选项选择正确释义</div>
            </div>
        </div>
        <div class="next-tip">✅ 选择正确自动进入下一词，错误将显示释义并继续</div>
    </div>
    <div id="reviewPanel" class="panel">
        <div class="info-bar">
            <span>📅 今日待复习: <span id="reviewDueCount">0</span></span>
            <span>📖 总复习池: <span id="reviewPoolCount">0</span></span>
        </div>
        <div id="reviewArea">
            <div class="word-card review-word-area">
                <div class="indo-word" id="reviewIndoWord">-</div>
                <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
                <div id="reviewChineseDisplay" class="chinese-answer" style="background:#f1f5f9;">⏳ 5秒后显示中文</div>
                <div class="action-buttons">
                    <button class="btn-remember" id="rememberBtn">✔️ 记住</button>
                    <button class="btn-forget" id="forgetBtn">🔄 忘记</button>
                </div>
                <div class="hint-text" id="reviewHint"></div>
            </div>
        </div>
        <div class="next-tip">⏰ 单词出现5秒后自动显示中文，点击“记住/忘记”进入下一复习</div>
    </div>
    <footer>🇮🇩 系统自动保存进度 | 新词隔天加入复习队列</footer>
</div>

<script>
    // --------------------------------------------------------------
    // 构建 2000 个印尼语单词（纯文本，无数字，无后缀字母）
    // 使用基础高频词 + 派生词（ber-/me-/-an/-i）构造，保证真实与规范
    // --------------------------------------------------------------
    
    // 1. 核心基础词库（约520个，去重后）
    const coreWords = [
        ["saya","我"],["kamu","你"],["dia","他/她"],["kami","我们(不含你)"],["kita","我们(含你)"],
        ["mereka","他们"],["ini","这个"],["itu","那个"],["dan","和"],["atau","或者"],["tapi","但是"],
        ["karena","因为"],["jadi","所以"],["sangat","非常"],["bisa","能"],["mau","想要"],["pergi","去"],
        ["datang","来"],["makan","吃"],["minum","喝"],["tidur","睡觉"],["bangun","醒来"],["baca","阅读"],
        ["tulis","写"],["dengar","听"],["lihat","看"],["besar","大"],["kecil","小"],["panjang","长"],
        ["pendek","短"],["baru","新的"],["lama","旧的"],["cepat","快"],["lambat","慢"],["mahal","昂贵"],
        ["murah","便宜"],["enak","美味"],["buruk","糟糕"],["baik","好"],["sedih","悲伤"],["senang","开心"],
        ["marah","生气"],["takut","害怕"],["berani","勇敢"],["pintar","聪明"],["bodoh","愚蠢"],["kaya","富有"],
        ["miskin","贫穷"],["sehat","健康"],["sakit","生病"],["rumah","房子"],["sekolah","学校"],["kantor","办公室"],
        ["toko","商店"],["jalan","路"],["mobil","汽车"],["motor","摩托车"],["sepeda","自行车"],["pesawat","飞机"],
        ["kereta","火车"],["buku","书"],["pensil","铅笔"],["pulpen","钢笔"],["kertas","纸"],["meja","桌子"],
        ["kursi","椅子"],["pintu","门"],["jendela","窗户"],["lampu","灯"],["jam","钟/小时"],["hari","日子"],
        ["bulan","月亮/月份"],["tahun","年"],["minggu","星期"],["saat","时刻"],["orang","人"],["anak","孩子"],
        ["ayah","父亲"],["ibu","母亲"],["kakak","哥哥/姐姐"],["adik","弟弟/妹妹"],["teman","朋友"],["guru","老师"],
        ["dokter","医生"],["polisi","警察"],["air","水"],["api","火"],["tanah","土地"],["udara","空气"],
        ["matahari","太阳"],["bintang","星星"],["awan","云"],["hujan","雨"],["angin","风"],["merah","红"],
        ["biru","蓝"],["hijau","绿"],["kuning","黄"],["hitam","黑"],["putih","白"],["ungu","紫"],["coklat","棕"],
        ["abuabu","灰色"],["oranye","橙"],["satu","一"],["dua","二"],["tiga","三"],["empat","四"],["lima","五"],
        ["enam","六"],["tujuh","七"],["delapan","八"],["sembilan","九"],["sepuluh","十"],["seratus","一百"],
        ["seribu","一千"],["setengah","一半"],["semua","全部"],["banyak","许多"],["sedikit","少许"],["beberapa","几个"],
        ["lain","其他"],["sendiri","自己"],["sama","相同"],["berbeda","不同"],["selalu","总是"],["kadang","有时"],
        ["pernah","曾经"],["segera","立刻"],["malam","夜晚"],["siang","白天"],["pagi","早晨"],["sore","傍晚"],
        ["kemarin","昨天"],["hariini","今天"],["besok","明天"],["sekarang","现在"],["nanti","稍后"],["dulu","以前"],
        ["tolong","请/帮忙"],["maaf","对不起"],["terimakasih","谢谢"],["samamasama","不客气"],["permisi","打扰"],
        ["ya","是"],["tidak","不"],["boleh","允许"],["harus","必须"],["ingin","想要"],["cinta","爱"],["benci","恨"],
        ["harap","希望"],["percaya","相信"],["lupa","忘记"],["kenal","认识"],["tunggu","等待"],["cari","寻找"],
        ["temukan","找到"],["bawa","携带"],["buat","做"],["rasa","感觉"],["pikir","思考"],["belajar","学习"],
        ["mengajar","教学"],["bekerja","工作"],["liburan","假期"],["wisata","旅游"],["pantai","海滩"],["gunung","山"],
        ["sungai","河流"],["danau","湖泊"],["hutan","森林"],["kota","城市"],["desa","乡村"],["negara","国家"],
        ["bahasa","语言"],["budaya","文化"],["makanan","食物"],["minuman","饮料"],["sayur","蔬菜"],["buah","水果"],
        ["daging","肉"],["ayam","鸡肉"],["sapi","牛肉"],["babi","猪肉"],["ikan","鱼"],["nasi","米饭"],["mie","面条"],
        ["roti","面包"],["telur","鸡蛋"],["garam","盐"],["gula","糖"],["pedas","辣"],["asam","酸"],["manis","甜"],
        ["pahit","苦"],["dingin","冷"],["panas","热"],["basah","湿"],["kering","干"],["terang","明亮"],["gelap","黑暗"],
        ["dekat","近"],["jauh","远"],["berat","重"],["ringan","轻"],["lembut","柔软"],["kasar","粗糙"],["halus","细腻"],
        ["tajam","锋利"],["tumpul","钝"],["hidup","活着"],["mati","死"],["indah","美丽"],["jelek","丑陋"],["bersih","干净"],
        ["kotor","肮脏"],["ramai","热闹"],["sepi","安静"],["kencang","快速"],["pelan","缓慢"],["sering","经常"],
        ["jarang","偶尔"],["mungkin","可能"],["pasti","肯定"],["tentu","当然"],["barat","西"],["timur","东"],
        ["utara","北"],["selatan","南"],["atas","上面"],["bawah","下面"],["dalam","里面"],["luar","外面"],
        ["depan","前面"],["belakang","后面"],["kanan","右边"],["kiri","左边"],["pasar","市场"],["masjid","清真寺"],
        ["gereja","教堂"],["pura","寺庙"],["bandara","机场"],["stasiun","车站"],["rumahsakit","医院"],["apotek","药店"],
        ["kebunbinatang","动物园"],["museum","博物馆"],["pantai","海滩"],["pulau","岛屿"],["jembatan","桥"],
        ["sungai","河流"],["airterjun","瀑布"],["gunungapi","火山"],["sawah","稻田"]
    ];
    
    // 去重 (基于印尼语)
    let wordMap = new Map(); // indo -> chinese
    for (let [indo, chn] of coreWords) {
        if (!wordMap.has(indo)) wordMap.set(indo, chn);
    }
    
    // 2. 派生词构造器 (合法印尼语词缀，不添加多余字母)
    const prefixes = ["ber", "me", "di", "ter", "pe"];
    const suffixes = ["an", "i", "kan"];
    
    // 基础词根池 (从已有单词中提取一些常见根词)
    let roots = [...wordMap.keys()].filter(w => w.length > 2 && w.length < 8);
    // 随机取词根构造新词，确保新词不重复且合理
    function deriveNewWord(root, index) {
        let newWord = "";
        let type = index % 5;
        if (type === 0 && prefixes.length) {
            let pref = prefixes[(index >> 2) % prefixes.length];
            newWord = pref + root;
        } else if (type === 1 && suffixes.length) {
            let suf = suffixes[index % suffixes.length];
            newWord = root + suf;
        } else if (type === 2 && prefixes.length && suffixes.length) {
            let pref = prefixes[(index) % prefixes.length];
            let suf = suffixes[(index+1) % suffixes.length];
            newWord = pref + root + suf;
        } else {
            // 简单重复或复合词（避免数字）
            newWord = root + root.slice(0,2);
        }
        // 确保新词看起来不像乱码且长度合理
        if (newWord.length > 12) newWord = root + suffixes[index % suffixes.length];
        return newWord;
    }
    
    // 扩展至2000词
    let currentSize = wordMap.size;
    let idx = 0;
    while (currentSize < 2000) {
        let root = roots[idx % roots.length];
        let candidate = deriveNewWord(root, idx);
        // 避免重复
        if (!wordMap.has(candidate)) {
            // 中文释义根据原词根稍作变化，保持语义相关
            let baseChinese = wordMap.get(root) || "词";
            let newChinese = baseChinese;
            if (candidate.includes("ber")) newChinese = "正在" + baseChinese;
            else if (candidate.includes("me")) newChinese = "进行" + baseChinese;
            else if (candidate.includes("di")) newChinese = "被" + baseChinese;
            else if (candidate.includes("ter")) newChinese = "最" + baseChinese;
            else if (candidate.includes("an")) newChinese = baseChinese + "的";
            else newChinese = baseChinese + "相关";
            wordMap.set(candidate, newChinese);
            currentSize++;
        }
        idx++;
        if (idx > 10000) break; // 安全保护
    }
    
    // 转为最终单词数组
    let fullWordList = [];
    for (let [indo, chn] of wordMap.entries()) {
        fullWordList.push({ id: fullWordList.length, indo: indo, chinese: chn });
    }
    // 确保正好2000，如果超出则截断（大概率刚好2000）
    if (fullWordList.length > 2000) fullWordList.length = 2000;
    console.log("当前词库数量(无数字无多余字母):", fullWordList.length);
    
    // 校验示例: 检查是否存在类似 "liburana" 这种带多余字母的词 (不应出现)
    let suspicious = fullWordList.filter(w => /[a-z]{1}\d/.test(w.indo) || /[a-z]{2}\d/.test(w.indo));
    if (suspicious.length === 0) console.log("✅ 词库干净，无数字/多余字母后缀");
    else console.warn("发现异常词:", suspicious);
    
    // --------------------------------------------------------------
    // 以下代码与原逻辑相同，使用 fullWordList 和 allWordMap
    // --------------------------------------------------------------
    const allWordMap = new Map();
    fullWordList.forEach(w => allWordMap.set(w.id, w));
    
    let unlearnedIds = [];
    let reviewQueue = [];
    
    function loadData() {
        const storedUnlearned = localStorage.getItem("indonesian_unlearned");
        const storedReview = localStorage.getItem("indonesian_reviewQueue");
        if (storedUnlearned && storedReview) {
            unlearnedIds = JSON.parse(storedUnlearned);
            reviewQueue = JSON.parse(storedReview);
            unlearnedIds = unlearnedIds.filter(id => allWordMap.has(id));
            reviewQueue = reviewQueue.filter(item => allWordMap.has(item.wordId));
        } else {
            unlearnedIds = fullWordList.map(w => w.id);
            reviewQueue = [];
            persistData();
        }
        updateStatsDisplay();
    }
    
    function persistData() {
        localStorage.setItem("indonesian_unlearned", JSON.stringify(unlearnedIds));
        localStorage.setItem("indonesian_reviewQueue", JSON.stringify(reviewQueue));
    }
    
    function addWordToReviewTomorrow(wordId) {
        const tomorrow = Date.now() + 86400000;
        const existingIndex = reviewQueue.findIndex(item => item.wordId === wordId);
        if (existingIndex === -1) {
            reviewQueue.push({ wordId: wordId, nextReviewDate: tomorrow });
        } else {
            reviewQueue[existingIndex].nextReviewDate = tomorrow;
        }
        persistData();
        updateStatsDisplay();
    }
    
    function removeFromUnlearned(wordId) {
        const idx = unlearnedIds.indexOf(wordId);
        if (idx !== -1) unlearnedIds.splice(idx, 1);
        persistData();
        updateStatsDisplay();
    }
    
    function getDueReviews() {
        const now = Date.now();
        return reviewQueue.filter(item => item.nextReviewDate <= now).map(item => item.wordId);
    }
    
    function updateStatsDisplay() {
        document.getElementById("totalWordsCount").innerText = fullWordList.length;
        document.getElementById("remainingNewCount").innerText = unlearnedIds.length;
        const dueIds = getDueReviews();
        document.getElementById("reviewDueCount").innerText = dueIds.length;
        document.getElementById("reviewPoolCount").innerText = reviewQueue.length;
    }
    
    // 新词模块
    let currentNewWordId = null;
    let waitingNext = false;
    
    function getRandomUnlearnedWord() {
        if (unlearnedIds.length === 0) return null;
        const randomIndex = Math.floor(Math.random() * unlearnedIds.length);
        return unlearnedIds[randomIndex];
    }
    
    function generateOptions(correctWordObj) {
        const correctChinese = correctWordObj.chinese;
        let otherChinese = [];
        for (let word of fullWordList) {
            if (word.id !== correctWordObj.id && !otherChinese.includes(word.chinese)) {
                otherChinese.push(word.chinese);
            }
        }
        let shuffled = [...otherChinese];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        let wrongOptions = shuffled.slice(0, 3);
        while(wrongOptions.length < 3) wrongOptions.push("默认选项");
        let options = [...wrongOptions, correctChinese];
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        return options.map(opt => ({ text: opt, isCorrect: opt === correctChinese }));
    }
    
    function renderNewWord() {
        if (waitingNext) return;
        const wordId = getRandomUnlearnedWord();
        if (!wordId) {
            document.getElementById("newIndoWord").innerText = "🎉 恭喜！";
            document.getElementById("optionsContainer").innerHTML = `<div style="grid-column:span 2; text-align:center">所有单词已学完！请明天复习巩固。</div>`;
            document.getElementById("newFeedbackMsg").innerText = "无新词啦，请进入复习模块";
            currentNewWordId = null;
            return;
        }
        currentNewWordId = wordId;
        const wordObj = allWordMap.get(wordId);
        document.getElementById("newIndoWord").innerText = wordObj.indo;
        const optionsArray = generateOptions(wordObj);
        const container = document.getElementById("optionsContainer");
        container.innerHTML = "";
        optionsArray.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => handleNewAnswer(opt.isCorrect, wordObj);
            container.appendChild(btn);
        });
        document.getElementById("newFeedbackMsg").innerHTML = "🤔 请选择一个释义";
    }
    
    function handleNewAnswer(isCorrect, wordObj) {
        if (waitingNext) return;
        waitingNext = true;
        const feedbackDiv = document.getElementById("newFeedbackMsg");
        if (isCorrect) {
            feedbackDiv.innerHTML = "✅ 正确！ +1 新词已进入明天复习队列";
            removeFromUnlearned(wordObj.id);
            addWordToReviewTomorrow(wordObj.id);
            setTimeout(() => {
                waitingNext = false;
                renderNewWord();
            }, 1000);
        } else {
            feedbackDiv.innerHTML = `❌ 错误！ 正确释义: ${wordObj.chinese}。 单词已加入明天复习队列`;
            removeFromUnlearned(wordObj.id);
            addWordToReviewTomorrow(wordObj.id);
            setTimeout(() => {
                waitingNext = false;
                renderNewWord();
            }, 1500);
        }
        const btns = document.querySelectorAll("#optionsContainer .option-btn");
        btns.forEach(btn => btn.disabled = true);
    }
    
    // 复习模块
    let currentReviewWordId = null;
    let timerInterval = null;
    let countdownSeconds = 5;
    let chineseShown = false;
    let allowAction = true;
    
    function stopReviewTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimerForReview() {
        stopReviewTimer();
        let remaining = countdownSeconds;
        const progressBar = document.getElementById("timerProgress");
        const chineseDiv = document.getElementById("reviewChineseDisplay");
        if (progressBar) progressBar.style.width = "100%";
        timerInterval = setInterval(() => {
            if (!allowAction) return;
            remaining -= 0.1;
            if (progressBar) {
                let percent = (remaining / countdownSeconds) * 100;
                percent = Math.max(0, percent);
                progressBar.style.width = `${percent}%`;
            }
            if (remaining <= 0) {
                if (currentReviewWordId && !chineseShown) {
                    const word = allWordMap.get(currentReviewWordId);
                    if (word) {
                        chineseDiv.innerHTML = `📖 ${word.chinese}`;
                        chineseDiv.style.background = "#d9f0ff";
                        chineseShown = true;
                    }
                }
                stopReviewTimer();
                if (progressBar) progressBar.style.width = "0%";
            }
        }, 100);
    }
    
    function loadNextReviewWord() {
        stopReviewTimer();
        allowAction = true;
        chineseShown = false;
        const dueIds = getDueReviews();
        if (dueIds.length === 0) {
            document.getElementById("reviewIndoWord").innerText = "🎯 太棒了！";
            document.getElementById("reviewChineseDisplay").innerHTML = "暂无今日复习任务 🎉";
            document.getElementById("reviewChineseDisplay").style.background = "#f1f5f9";
            document.getElementById("rememberBtn").disabled = true;
            document.getElementById("forgetBtn").disabled = true;
            if (document.getElementById("timerProgress")) document.getElementById("timerProgress").style.width = "0%";
            currentReviewWordId = null;
            document.getElementById("reviewHint").innerHTML = "完成今日复习，明天再来吧~";
            return;
        }
        const nextId = dueIds[0];
        currentReviewWordId = nextId;
        const wordObj = allWordMap.get(nextId);
        document.getElementById("reviewIndoWord").innerText = wordObj.indo;
        document.getElementById("reviewChineseDisplay").innerHTML = "⏳ 5秒后显示中文";
        document.getElementById("reviewChineseDisplay").style.background = "#f1f5f9";
        document.getElementById("rememberBtn").disabled = false;
        document.getElementById("forgetBtn").disabled = false;
        document.getElementById("reviewHint").innerHTML = "思考中...";
        chineseShown = false;
        if (document.getElementById("timerProgress")) document.getElementById("timerProgress").style.width = "100%";
        startTimerForReview();
    }
    
    function handleRemember() {
        if (!allowAction || !currentReviewWordId) return;
        allowAction = false;
        stopReviewTimer();
        const idx = reviewQueue.findIndex(item => item.wordId === currentReviewWordId);
        if (idx !== -1) reviewQueue.splice(idx, 1);
        persistData();
        updateStatsDisplay();
        loadNextReviewWord();
    }
    
    function handleForget() {
        if (!allowAction || !currentReviewWordId) return;
        allowAction = false;
        stopReviewTimer();
        const idx = reviewQueue.findIndex(item => item.wordId === currentReviewWordId);
        if (idx !== -1) reviewQueue.splice(idx, 1);
        reviewQueue.push({ wordId: currentReviewWordId, nextReviewDate: Date.now() });
        persistData();
        updateStatsDisplay();
        loadNextReviewWord();
    }
    
    function refreshReviewPanel() {
        if (document.getElementById("reviewPanel").classList.contains("active-panel")) {
            loadNextReviewWord();
        }
    }
    
    function initTabs() {
        const tabs = document.querySelectorAll(".tab-btn");
        const panels = document.querySelectorAll(".panel");
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                const target = tab.dataset.tab;
                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                panels.forEach(panel => panel.classList.remove("active-panel"));
                if (target === "new") {
                    document.getElementById("newPanel").classList.add("active-panel");
                    if (!waitingNext) renderNewWord();
                } else {
                    document.getElementById("reviewPanel").classList.add("active-panel");
                    refreshReviewPanel();
                }
            });
        });
    }
    
    function init() {
        loadData();
        initTabs();
        renderNewWord();
        document.getElementById("rememberBtn").addEventListener("click", handleRemember);
        document.getElementById("forgetBtn").addEventListener("click", handleForget);
        updateStatsDisplay();
    }
    init();
</script>
</body>
</html>
